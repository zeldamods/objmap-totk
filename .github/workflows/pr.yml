name: pr
on:
  push:
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: 'pnpm'
    - name: install dependencies
      run: pnpm ci
    - name: build
      run: pnpm run build
